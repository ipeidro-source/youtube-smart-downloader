name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and version
        run: python scripts/check_release.py
      - name: Require a commit integrated into main
        run: git merge-base --is-ancestor HEAD origin/main

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YouTubeSmartDownloader-Windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/YouTubeSmartDownloader.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
