name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check tag and version
        id: version
        run: python scripts/check_release.py
      - name: Require a commit integrated into main
        run: git merge-base --is-ancestor HEAD origin/main

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, build]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt -e ".[dev]"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: YouTubeSmartDownloader-Windows-x64
          path: dist
      - name: Check final executable metadata and notices
        run: python scripts/check_windows_exe.py
      - name: Check final executable startup
        run: python scripts/smoke_windows.py
      - name: Package final executable and hash release files
        run: python scripts/package_release.py
      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            dist/YouTubeSmartDownloader.exe
            dist/YouTubeSmartDownloader-*-Windows-x64.zip
            dist/SHA256SUMS.txt
          body: The portable ZIP includes the executable, licenses, privacy policy and uninstallation instructions. SHA256SUMS.txt covers the final EXE and ZIP.
          generate_release_notes: true
          fail_on_unmatched_files: true
