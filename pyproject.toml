[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-smart-downloader"
version = "0.2.0"
description = "Windows desktop downloader with multiple audio tracks and embedded subtitles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ipeidro"}]
dependencies = ["customtkinter>=5.2,<6"]

[project.urls]
Homepage = "https://github.com/ipeidro-source/youtube-smart-downloader"
Repository = "https://github.com/ipeidro-source/youtube-smart-downloader"
Issues = "https://github.com/ipeidro-source/youtube-smart-downloader/issues"

[tool.ytsd.windows]
product-name = "YouTube Smart Downloader"
file-description = "YouTube video and playlist downloader with selectable audio and embedded subtitles"
copyright = "Copyright (c) 2026 ipeidro"
internal-name = "YouTubeSmartDownloader"
original-filename = "YouTubeSmartDownloader.exe"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6,<7", "mypy>=1.14,<2", "Pillow>=11,<13"]

[project.scripts]
youtube-smart-downloader = "youtube_smart_downloader.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_smart_downloader = ["assets/*.ico", "assets/*.png"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src", "scripts"]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
