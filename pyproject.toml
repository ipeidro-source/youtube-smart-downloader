[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-smart-downloader"
version = "0.1.0"
description = "Windows desktop interface for yt-dlp with explicit audio language selection"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "YouTube Smart Downloader contributors"}]
dependencies = ["customtkinter>=5.2,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6,<7", "mypy>=1.14,<2", "Pillow>=11,<13"]

[project.scripts]
youtube-smart-downloader = "youtube_smart_downloader.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_smart_downloader = ["assets/*.ico", "assets/*.png"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src", "scripts"]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
